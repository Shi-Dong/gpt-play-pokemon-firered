<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FireRed live gameplay</title>
<style>body{background:#111827;color:#e5e7eb;font:16px system-ui;max-width:1100px;margin:24px auto;padding:16px}img{width:480px;max-width:100%;image-rendering:pixelated;border:2px solid #475569}button{background:#1e293b;color:#eee;border:1px solid #64748b;padding:10px;margin:6px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e293b;padding:14px}#status,#latency{color:#fbbf24}.columns{display:flex;gap:24px;flex-wrap:wrap}#options button{display:block}#latency{font-size:22px}</style>
<h1>FireRed live gameplay</h1><p id="status">Connecting…</p>
<p id="latency">Model call: awaiting first response</p><p id="decision"></p><p id="error"></p>
<button id="pause">Pause</button><button id="resume">Resume autonomous play</button><button id="save">Save checkpoint</button>
<div class="columns"><div><img id="screen" alt="Live FireRed framebuffer"><p id="location"></p><p id="goal"></p></div><div id="options"></div></div>
<details><summary>Model probabilities and timing</summary><pre id="metrics"></pre></details>
<details><summary>Structured game state</summary><pre id="details"></pre></details>
<script>
let snapshot=null,busy=false,controller={},refreshing=false,imagePending=false;
const el=id=>document.getElementById(id);
async function metrics(){try{const r=await fetch('/api/controller');controller=await r.json();el('status').textContent=(controller.autoplay?'Autonomous':'Paused')+' · '+controller.phase+' · '+(controller.model||'model disconnected')+' · '+(controller.decisions||0)+' decisions';el('error').textContent=controller.error||'';const ms=controller.latest_latency_ms;el('latency').textContent=(ms==null?'Model call: awaiting first response':'Latest model call: '+(ms/1000).toFixed(2)+' s ('+Math.round(ms)+' ms)')+(controller.call_started_at?' · current call '+((Date.now()/1000-controller.call_started_at).toFixed(1))+' s':'');el('decision').textContent=controller.latest_decision?'Latest choice: '+controller.latest_decision.description:'';el('metrics').textContent=JSON.stringify(controller,null,2);for(const b of el('options').children)b.disabled=controller.autoplay||busy}catch(e){el('status').textContent='Controller unavailable: '+e.message}}
async function refresh(){if(busy||refreshing)return;refreshing=true;try{const r=await fetch('/api/state');if(!r.ok)throw Error(await r.text());snapshot=await r.json();const s=snapshot.state;el('location').textContent=s.location.name?s.location.name+' '+JSON.stringify(s.location.position):'Opening sequence';el('goal').textContent='Goal: '+(s.memory.next_goal.hint||'Hall of Fame complete');el('details').textContent=JSON.stringify(s,null,2);el('options').replaceChildren();for(const option of snapshot.options){const b=document.createElement('button');b.textContent=option.label+': '+option.description;b.disabled=controller.autoplay||busy;b.onclick=()=>execute(option.id);el('options').appendChild(b)}}catch(e){el('error').textContent=e.message}finally{refreshing=false}}
async function execute(id){if(busy||!snapshot||controller.autoplay)return;busy=true;try{const r=await fetch('/api/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choice_id:id,fingerprint:snapshot.fingerprint})});if(!r.ok)throw Error(await r.text())}catch(e){el('error').textContent=e.message}finally{busy=false;refresh()}}
async function control(enabled){try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});if(!r.ok)throw Error(await r.text());metrics()}catch(e){el('error').textContent=e.message}}
el('pause').onclick=()=>control(false);el('resume').onclick=()=>control(true);
el('save').onclick=async()=>{if(busy)return;busy=true;try{const r=await fetch('/api/checkpoint',{method:'POST'});el('error').textContent=JSON.stringify(await r.json())}finally{busy=false}};
el('screen').onload=el('screen').onerror=()=>{imagePending=false};
setInterval(()=>{if(!imagePending){imagePending=true;el('screen').src='/screen.png?t='+Date.now()}},1000);setInterval(metrics,1000);setInterval(refresh,4000);metrics();refresh();el('screen').src='/screen.png';
</script></html>
